# Render Deployment Configuration
# Single Web Service: FastAPI serves both API and React SPA (built from frontend/)

services:
  - type: web
    name: financial-risk-analyser
    runtime: python
    plan: starter
    buildCommand: |
      pip install -r requirements.txt
      cd frontend && npm install && npm run build
    startCommand: gunicorn main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: ALPHA_VANTAGE_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: USE_MOCK_DATA
        value: "false"
      - key: ENABLE_DOCS
        value: "false"
      - key: FINNHUB_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://your-frontend.onrender.com,http://localhost:8501"
      - key: AV_MAX_RETRIES
        value: "3"
      - key: AV_RETRY_BASE_DELAY
        value: "12"
    healthCheckPath: /health
    autoDeploy: true