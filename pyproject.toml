[project]
name = "financial-risk-analyser"
version = "0.1.0"
description = "Enterprise Multi-Agent Due-Diligence & Quantitative Risk Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139.0",
    "feedparser>=6.0.13",
    "finnhub-python>=2.4.29",
    "google-genai>=2.14.0",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "langgraph>=1.2.7",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "uvicorn>=0.49.0",
]
[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
